<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de Horários</title>
</head>

<body>
    <h1>Tabela de Horários - 2º Bimestre</h1>

    <table border="1">
        <thead>
            <tr>
                <th>Dia</th>
                <th>Horário</th> 
                <th>Disciplina</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td rowspan="2">Segunda</td>
                <td>07:00 - 08:30</td>
                <td>Matemática</td>
            </tr>
            <tr>
                <td>08:30 - 10:00</td>
                <td>Português</td>
            </tr>

            <tr>
                <td>Terça</td>
                <td colspan="2">Projeto Interdisciplinar</td>
            </tr>

            <tr>
                <td>Quarta</td>
                <td>07:00 - 08:30</td>
                <td>Educação Física</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="3">Horários sujeitos a alteração</td>
            </tr>
        </tfoot>
    </table>
</body>

</html>
