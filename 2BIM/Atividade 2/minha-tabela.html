<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Tabela</title>
    <style>
        table {
            width: 60%;
            border-collapse: collapse;
            margin: 20px auto;
            font-family: Arial, sans-serif;
        }

        th,
        td {
            border: 1px solid #555;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #f2f2f2;
        }

        caption {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1.2em;
        }
    </style>
</head>

<body>
    <table>
        <caption>Tabela de Exemplo</caption>
        <tr>
            <th>Nome</th>
            <th>Idade</th>
            <th>Cidade</th>
        </tr>
        <tr>
            <td>Daniel</td>
            <td>17</td>
            <td>Natal</td>
        </tr>
        <tr>
            <td>Maria</td>
            <td>17</td>
            <td>Mossoró</td>
        </tr>
        <tr>
            <td>Lucas</td>
            <td>15</td>
            <td>Caicó</td>
        </tr>
        <tr>
            <td>Isis</td>
            <td>16</td>
            <td>Parnamirim</td>
        </tr>
        <tr>
            <td>João</td>
            <td>18</td>
            <td>Macau</td>
        </tr>
    </table>
</body>

</html>
